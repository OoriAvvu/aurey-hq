<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi Shop Incremental</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 40px 0 0 60px; /* Decent margin pushing content to the left */
    }

    h1 {
      font-size: 1.4rem;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* Resource Header */
    .resources {
      margin-bottom: 30px;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .resources span {
      font-weight: bold;
    }

    /* Column Layout inspired by Image 2 */
    .columns-container {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .column {
      border: 1px solid #000000;
      width: 190px;
      min-height: 260px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .column-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #000000;
      padding-bottom: 4px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    /* Simple minimal buttons inspired by Image 3 */
    button {
      background: #ffffff;
      border: 1px solid #000000;
      color: #000000;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.1s;
      width: 100%;
    }

    button:hover:not(:disabled) {
      background: #000000;
      color: #ffffff;
    }

    button:disabled {
      border-color: #ccc;
      color: #aaa;
      cursor: not-allowed;
    }

    .locked-text {
      color: #999999;
      font-size: 0.8rem;
      font-style: italic;
      padding-top: 4px;
    }
  </style>
</head>
<body>

  <h1>Sushi Shop</h1>

  <!-- Top Resource Display -->
  <div class="resources">
    <div>Money: $<span id="money">10.00</span></div>
    <div>Shari: <span id="shari">0</span> portions</div>
    <div>Raw Salmon: <span id="salmon">0</span> portions</div>
    <div>Salmon Nigiri: <span id="nigiri">0</span> pc</div>
  </div>

  <!-- 5 Column Interface -->
  <div class="columns-container">
    
    <!-- Column 1: Buy Ingredients -->
    <div class="column">
      <div class="column-title">Ingredients</div>
      <button id="btn-buy-shari" onclick="buyShari()">Buy Shari ($0.10)</button>
      <button id="btn-buy-salmon" onclick="buySalmon()">Buy Raw Salmon ($0.40)</button>
    </div>

    <!-- Column 2: Processing (Locked for now) -->
    <div class="column">
      <div class="column-title">Processing</div>
      <div class="locked-text">Locked</div>
    </div>

    <!-- Column 3: Assembly -->
    <div class="column">
      <div class="column-title">Assembly</div>
      <button id="btn-make-nigiri" onclick="makeNigiri()">Make Salmon Nigiri</button>
    </div>

    <!-- Column 4: Blank -->
    <div class="column">
      <div class="column-title">&nbsp;</div>
    </div>

    <!-- Column 5: Sales -->
    <div class="column">
      <div class="column-title">Sales</div>
      <button id="btn-sell-plate" onclick="sellPlate()">Sell Plate (2pc) ($1.20)</button>
    </div>

  </div>

  <script>
    // Game State
    let state = {
      money: 10.00,
      shari: 0,
      rawSalmon: 0,
      salmonNigiri: 0
    };

    function buyShari() {
      if (state.money >= 0.10) {
        state.money -= 0.10;
        state.shari += 6; // 6 portions (enough for 3 plates)
        updateDisplay();
      }
    }

    function buySalmon() {
      if (state.money >= 0.40) {
        state.money -= 0.40;
        state.rawSalmon += 3; // 3 portions (enough for 1.5 plates)
        updateDisplay();
      }
    }

    function makeNigiri() {
      if (state.shari >= 1 && state.rawSalmon >= 1) {
        state.shari -= 1;
        state.rawSalmon -= 1;
        state.salmonNigiri += 1;
        updateDisplay();
      }
    }

    function sellPlate() {
      if (state.salmonNigiri >= 2) {
        state.salmonNigiri -= 2;
        state.money += 1.20;
        updateDisplay();
      }
    }

    function updateDisplay() {
      // Round money properly to handle floating point precision
      document.getElementById('money').innerText = state.money.toFixed(2);
      document.getElementById('shari').innerText = state.shari;
      document.getElementById('salmon').innerText = state.rawSalmon;
      document.getElementById('nigiri').innerText = state.salmonNigiri;

      // Dynamic button state updates
      document.getElementById('btn-buy-shari').disabled = state.money < 0.10;
      document.getElementById('btn-buy-salmon').disabled = state.money < 0.40;
      document.getElementById('btn-make-nigiri').disabled = state.shari < 1 || state.rawSalmon < 1;
      document.getElementById('btn-sell-plate').disabled = state.salmonNigiri < 2;
    }

    // Initialize UI on load
    updateDisplay();
  </script>
</body>
</html>
