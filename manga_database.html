<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff6600%22/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUREY's // Manga Vault</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* Dark Theme Variables (Default) */
        :root {
            --bg-body: #0b0b0e;
            --bg-card: #14141a;
            --bg-card-hover: #1c1c26;
            --accent-orange: #ff6600;
            --accent-orange-bright: #ff8800;
            --accent-orange-glow: rgba(255, 102, 0, 0.25);
            --border-color: #22222e;
            --text-main: #f0f0f6;
            --text-muted: #8e8e9f;
            --input-bg: #181822;
            --header-border: #22222e;
            --modal-overlay: rgba(0, 0, 0, 0.75);
        }

        /* Light Theme Variables */
        [data-theme="light"] {
            --bg-body: #f4f4f8;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f6;
            --accent-orange: #ff5500;
            --accent-orange-bright: #e64d00;
            --accent-orange-glow: rgba(255, 85, 0, 0.15);
            --border-color: #e2e2ec;
            --text-main: #1a1a24;
            --text-muted: #666680;
            --input-bg: #ffffff;
            --header-border: #d8d8e5;
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 2rem 5%;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar & Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--header-border);
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo {
            width: 14px; height: 28px;
            background: var(--accent-orange);
            transform: skewX(-15deg);
            box-shadow: 0 0 12px var(--accent-orange-glow);
        }
        .brand h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        .brand h1 span { color: var(--accent-orange); }

        .theme-btn {
            background: var(--bg-card);
            color: var(--accent-orange);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--accent-orange);
            transition: all 0.2s ease;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-btn:hover {
            background: var(--accent-orange);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-orange-glow);
            transform: translateY(-2deg);
        }

        /* Add Form Card */
        .add-card-form {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .add-card-form input, .add-card-form select,
        .modal-body input, .modal-body select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            flex: 1;
            min-width: 140px;
            transition: border-color 0.2s ease;
        }

        .add-card-form input:focus, .add-card-form select:focus,
        .modal-body input:focus, .modal-body select:focus { 
            border-color: var(--accent-orange); 
        }

        .btn-action {
            background: var(--accent-orange);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: var(--accent-orange-bright);
            box-shadow: 0 0 12px var(--accent-orange-glow);
        }

        /* Status Filter Navigation */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-orange);
        }

        .filter-btn.active {
            background: var(--accent-orange);
            color: #fff;
            border-color: var(--accent-orange);
            box-shadow: 0 0 12px var(--accent-orange-glow);
        }

        /* Manga Grid */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .manga-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.3s ease;
        }

        .manga-card:hover {
            transform: translateY(-4deg);
            border-color: var(--accent-orange);
        }

        .cover-wrapper {
            width: 100%;
            height: 280px;
            background: var(--input-bg);
            position: relative;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .manga-title {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .chapter-display-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
        }

        .chapter-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .chapter-num {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: var(--accent-orange);
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .edit-link {
            background: transparent;
            border: none;
            color: var(--accent-orange);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            text-align: right;
            margin-top: 4px;
            opacity: 0.8;
            transition: opacity 0.2s ease, color 0.2s ease;
        }
        .edit-link:hover { 
            opacity: 1; 
            color: var(--accent-orange-bright);
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-orange);
            text-transform: uppercase;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 0.5rem;
        }

        .btn-danger {
            background: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 8px 14px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            background: #ff4444;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo"></div>
            <h1>AUREY's Manga <span>// Vault</span></h1>
        </div>

        <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 DARK</button>
    </header>

    <!-- Add New Manga Form -->
    <div class="add-card-form">
        <input type="text" id="inputTitle" placeholder="作品名 (e.g., Berserk, となりの猫と恋知らず)..." required>
        <input type="number" id="inputChapter" placeholder="Ch. #" style="max-width: 90px;" value="1">
        <input type="url" id="inputCover" placeholder="表紙イメージのURL (空白のままでオートフェッチ)">
        <select id="inputStatus">
            <option value="Reading">読中</option>
            <option value="Plan to Read">読みたい</option>
            <option value="Completed">読了</option>
            <option value="Dropped">中断</option>
        </select>
        <button class="btn-action" id="addBtn" onclick="addManga()">+ Add Entry</button>
    </div>

    <!-- Status Filter Bar -->
    <nav class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('All')">すべて</button>
        <button class="filter-btn" onclick="setFilter('Reading')">読中</button>
        <button class="filter-btn" onclick="setFilter('Plan to Read')">読みたい</button>
        <button class="filter-btn" onclick="setFilter('Completed')">読了</button>
        <button class="filter-btn" onclick="setFilter('Dropped')">中断</button>
    </nav>

    <!-- Live Grid -->
    <main class="manga-grid" id="mangaContainer">
        <div style="color: var(--text-muted);">Syncing with cloud database...</div>
    </main>

    <!-- Edit Modal Overlay -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title">Edit Entry</div>
            </div>
            
            <div class="modal-body">
                <input type="hidden" id="editOldKey">
                
                <div class="form-group">
                    <label>Manga Title</label>
                    <input type="text" id="editTitle">
                </div>

                <div class="form-group">
                    <label>Sort Reading / Yomigana (Optional)</label>
                    <input type="text" id="editSortKey" placeholder="e.g. となりのねこ...">
                </div>

                <div class="form-group">
                    <label>Current Read Chapter</label>
                    <input type="number" id="editChapter" min="0">
                </div>

                <div class="form-group">
                    <label>Reading Status</label>
                    <select id="editStatus">
                        <option value="Reading">Reading</option>
                        <option value="Plan to Read">Plan to Read</option>
                        <option value="Completed">Completed</option>
                        <option value="Dropped">Dropped</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Cover Image URL (Leave blank to re-fetch)</label>
                    <input type="url" id="editCover">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-danger" onclick="deleteEntryFromModal()">Delete Entry</button>
                <div style="display: flex; gap: 8px;">
                    <button class="filter-btn" onclick="closeEditModal()">Cancel</button>
                    <button class="btn-action" id="saveBtn" onclick="saveModalChanges()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Firebase Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyBd8uDrxpy9jgoCu7GipIuja1Gwhk_n1Dg",
            authDomain: "aurey-hq.firebaseapp.com",
            databaseURL: "https://aurey-hq-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "aurey-hq",
            storageBucket: "aurey-hq.firebasestorage.app",
            messagingSenderId: "1044153557118",
            appId: "1:1044153557118:web:7f9164cd3291cf3e37382f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Zero-network memory fallback SVG
        const svgFallback = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='280' viewBox='0 0 220 280'><rect width='100%' height='100%' fill='%23181822'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23ff6600' font-family='sans-serif' font-weight='bold' font-size='16'>NO COVER</text></svg>";

        let currentData = null;
        let activeFilter = 'All';

        // Real-time Database Listener
        const mangaRef = ref(db, 'manga');
        onValue(mangaRef, (snapshot) => {
            currentData = snapshot.val();
            renderGrid();
        });

        // Filter and Render Cards (Sorted using Intl.Collator with custom sortKey fallback)
        function renderGrid() {
            const container = document.getElementById('mangaContainer');
            
            if (!currentData) {
                container.innerHTML = `<div style="color: var(--text-muted); grid-column: 1/-1;">No manga entries yet. Add one above!</div>`;
                return;
            }

            let keys = Object.keys(currentData).filter(key => {
                if (activeFilter === 'All') return true;
                return currentData[key].status === activeFilter;
            });

            const jaCollator = new Intl.Collator('ja', { numeric: true, sensitivity: 'base' });
            keys.sort((a, b) => {
                const sortA = currentData[a].sortKey || currentData[a].title || '';
                const sortB = currentData[b].sortKey || currentData[b].title || '';
                return jaCollator.compare(sortA, sortB);
            });

            if (keys.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); grid-column: 1/-1;">No entries under "${activeFilter}".</div>`;
                return;
            }

            container.innerHTML = keys.map(key => {
                const item = currentData[key];
                const cover = item.cover || svgFallback;

                return `
                    <div class="manga-card">
                        <div class="cover-wrapper">
                            <img src="${cover}" class="cover-img" alt="" onerror="this.onerror=null; this.src='${svgFallback}';">
                        </div>
                        <div class="card-details">
                            <div class="manga-title" title="${item.title}">${item.title}</div>
                            
                            <div class="chapter-display-row">
                                <span class="chapter-label">チャプター</span>
                                <span class="chapter-num">${item.chapter}話</span>
                            </div>

                            <button class="edit-link" onclick="openEditModal('${key}')">編集</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Change Filter Function
        window.setFilter = function(filter) {
            activeFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.textContent.trim().toLowerCase() === filter.toLowerCase()) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            renderGrid();
        };

        // Direct Browser Fetch: AniList for high-res cover art
        async function fetchAniListCover(title) {
            try {
                const res = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        query: `query ($search: String) { Media (search: $search, type: MANGA) { coverImage { extraLarge large } } }`,
                        variables: { search: title }
                    })
                });
                if (res.ok) {
                    const json = await res.json();
                    const media = json?.data?.Media;
                    return media?.coverImage?.extraLarge || media?.coverImage?.large || '';
                }
            } catch (err) {
                console.log('AniList cover fetch error:', err);
            }
            return '';
        }

        // Add Manga Function
        window.addManga = async function() {
            const titleInput = document.getElementById('inputTitle');
            const title = titleInput.value.trim();
            const chapter = parseInt(document.getElementById('inputChapter').value) || 1;
            let cover = document.getElementById('inputCover').value.trim();
            const status = document.getElementById('inputStatus').value;
            const addBtn = document.getElementById('addBtn');

            if (!title) return alert('Please enter a title!');

            addBtn.textContent = 'Fetching Cover...';
            addBtn.disabled = true;

            if (!cover) {
                cover = await fetchAniListCover(title);
            }

            addBtn.textContent = '+ Add Entry';
            addBtn.disabled = false;

            const key = encodeURIComponent(title.toLowerCase().replace(/\s+/g, '-')).replace(/%/g, '_');

            set(ref(db, `manga/${key}`), {
                title: title,
                sortKey: title,
                chapter: chapter,
                cover: cover || '',
                status: status,
                createdAt: Date.now()
            });

            titleInput.value = '';
            document.getElementById('inputCover').value = '';
        };

        // Modal Controls
        window.openEditModal = function(key) {
            if (!currentData || !currentData[key]) return;
            const item = currentData[key];

            document.getElementById('editOldKey').value = key;
            document.getElementById('editTitle').value = item.title;
            document.getElementById('editSortKey').value = item.sortKey || item.title;
            document.getElementById('editChapter').value = item.chapter;
            document.getElementById('editStatus').value = item.status;
            document.getElementById('editCover').value = item.cover || '';

            document.getElementById('editModal').style.display = 'flex';
        };

        window.closeEditModal = function() {
            document.getElementById('editModal').style.display = 'none';
        };

        window.saveModalChanges = async function() {
            const oldKey = document.getElementById('editOldKey').value;
            const newTitle = document.getElementById('editTitle').value.trim();
            let newSortKey = document.getElementById('editSortKey').value.trim();
            const newChapter = parseInt(document.getElementById('editChapter').value) || 0;
            const newStatus = document.getElementById('editStatus').value;
            let newCover = document.getElementById('editCover').value.trim();
            const saveBtn = document.getElementById('saveBtn');

            if (!oldKey || !newTitle) return alert('Title cannot be empty!');
            if (!newSortKey) newSortKey = newTitle;

            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;

            const existingItem = currentData[oldKey] || {};

            // If cover is missing or title changed, fetch fresh cover art from AniList
            if (!newCover || existingItem.title !== newTitle) {
                if (!newCover) {
                    newCover = await fetchAniListCover(newTitle);
                }
            }

            const newKey = encodeURIComponent(newTitle.toLowerCase().replace(/\s+/g, '-')).replace(/%/g, '_');

            if (oldKey !== newKey) {
                await remove(ref(db, `manga/${oldKey}`));
            }

            await set(ref(db, `manga/${newKey}`), {
                title: newTitle,
                sortKey: newSortKey,
                chapter: newChapter,
                cover: newCover || '',
                status: newStatus,
                createdAt: existingItem.createdAt || Date.now()
            });

            saveBtn.textContent = 'Save';
            saveBtn.disabled = false;
            closeEditModal();
        };

        window.deleteEntryFromModal = function() {
            const key = document.getElementById('editOldKey').value;
            if (!key) return;

            if (confirm('Are you sure you want to delete this manga entry?')) {
                remove(ref(db, `manga/${key}`));
                closeEditModal();
            }
        };

        // Theme Toggle Logic
        window.toggleTheme = function() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('themePreference', newTheme);
            
            const btn = document.getElementById('themeToggleBtn');
            btn.textContent = newTheme === 'light' ? '☀️ ライト' : '🌙 ダーク';
        };

        (function initTheme() {
            const savedTheme = localStorage.getItem('themePreference') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            const btn = document.getElementById('themeToggleBtn');
            if (btn) {
                btn.textContent = savedTheme === 'light' ? '☀️ ライト' : '🌙 ダーク';
            }
        })();
    </script>
</body>
</html>
