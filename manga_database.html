<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff6600%22/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おーりの // 漫画図鑑ー</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* Dark Theme Variables (Default) */
        :root {
            --bg-body: #0b0b0e;
            --bg-card: #14141a;
            --bg-card-hover: #1c1c26;
            --accent-orange: #ff6600;
            --accent-orange-bright: #ff8800;
            --accent-orange-glow: rgba(255, 102, 0, 0.25);
            --border-color: #22222e;
            --text-main: #f0f0f6;
            --text-muted: #8e8e9f;
            --input-bg: #181822;
            --header-border: #22222e;
            --modal-overlay: rgba(0, 0, 0, 0.75);
        }

        /* Light Theme Variables */
        [data-theme="light"] {
            --bg-body: #f4f4f8;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f6;
            --accent-orange: #ff5500;
            --accent-orange-bright: #e64d00;
            --accent-orange-glow: rgba(255, 85, 0, 0.15);
            --border-color: #e2e2ec;
            --text-main: #1a1a24;
            --text-muted: #666680;
            --input-bg: #ffffff;
            --header-border: #d8d8e5;
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 1.5rem 4%;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar & Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--header-border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo {
            width: 11px; height: 22px;
            background: var(--accent-orange);
            transform: skewX(-15deg);
            box-shadow: 0 0 10px var(--accent-orange-glow);
        }
        .brand h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        .brand h1 span { color: var(--accent-orange); }

        .theme-btn {
            background: var(--bg-card);
            color: var(--accent-orange);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--accent-orange);
            transition: all 0.2s ease;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .theme-btn:hover {
            background: var(--accent-orange);
            color: #fff;
            box-shadow: 0 0 12px var(--accent-orange-glow);
            transform: translateY(-1.5deg);
        }

        /* Add Form Card */
        .add-card-form {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.2rem;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .add-card-form input, .add-card-form select,
        .modal-body input, .modal-body select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 8px 12px;
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
            flex: 1;
            min-width: 120px;
            transition: border-color 0.2s ease;
        }

        .add-card-form input:focus, .add-card-form select:focus,
        .modal-body input:focus, .modal-body select:focus { 
            border-color: var(--accent-orange); 
        }

        .btn-action {
            background: var(--accent-orange);
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 8px 16px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: var(--accent-orange-bright);
            box-shadow: 0 0 10px var(--accent-orange-glow);
        }

        /* Status Filter Navigation */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: var(--text-main);
            border-color: var(--accent-orange);
        }

        .filter-btn.active {
            background: var(--accent-orange);
            color: #fff;
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px var(--accent-orange-glow);
        }

        /* Manga Grid */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 1.2rem;
        }

        .manga-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.3s ease;
        }

        .manga-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-orange);
        }

        .cover-wrapper {
            width: 100%;
            height: 220px;
            background: var(--input-bg);
            position: relative;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .manga-title {
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .chapter-display-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 6px 10px;
        }

        .chapter-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: var(--text-muted);
        }

        .chapter-num {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: var(--accent-orange);
            font-size: 0.85rem;
            letter-spacing: 0.4px;
        }

        .card-footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 2px;
        }

        .fav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.15rem;
            cursor: pointer;
            transition: color 0.2s ease, transform 0.2s ease;
            padding: 2px 4px;
            line-height: 1;
        }

        .fav-btn:hover {
            color: #ffcc00;
            transform: scale(1.2);
        }
