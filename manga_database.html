<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23ff6600%22/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUREY's // Manga Vault</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>
        /* Dark Theme Variables (Default) */
        :root {
            --bg-body: #0b0b0e;
            --bg-card: #14141a;
            --bg-card-hover: #1c1c26;
            --accent-orange: #ff6600;
            --accent-orange-bright: #ff8800;
            --accent-orange-glow: rgba(255, 102, 0, 0.25);
            --border-color: #22222e;
            --text-main: #f0f0f6;
            --text-muted: #8e8e9f;
            --input-bg: #181822;
            --header-border: #22222e;
        }

        /* Light Theme Variables */
        [data-theme="light"] {
            --bg-body: #f4f4f8;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f6;
            --accent-orange: #ff5500;
            --accent-orange-bright: #e64d00;
            --accent-orange-glow: rgba(255, 85, 0, 0.15);
            --border-color: #e2e2ec;
            --text-main: #1a1a24;
            --text-muted: #666680;
            --input-bg: #ffffff;
            --header-border: #d8d8e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 2rem 5%;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar & Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--header-border);
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo {
            width: 14px; height: 28px;
            background: var(--accent-orange);
            transform: skewX(-15deg);
            box-shadow: 0 0 12px var(--accent-orange-glow);
        }
        .brand h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        .brand h1 span { color: var(--accent-orange); }

        .theme-btn {
            background: var(--bg-card);
            color: var(--accent-orange);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--accent-orange);
            transition: all 0.2s ease;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-btn:hover {
            background: var(--accent-orange);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-orange-glow);
            transform: translateY(-2deg);
        }

        /* Add Form Card */
        .add-card-form {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .add-card-form input, .add-card-form select {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            flex: 1;
            min-width: 140px;
            transition: border-color 0.2s ease;
        }

        .add-card-form input:focus, .add-card-form select:focus { 
            border-color: var(--accent-orange); 
        }

        .btn-action {
            background: var(--accent-orange);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: var(--accent-orange-bright);
            box-shadow: 0 0 12px var(--accent-orange-glow);
        }

        /* Manga Grid */
        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .manga-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.3s ease;
        }

        .manga-card:hover {
            transform: translateY(-4deg);
            border-color: var(--accent-orange);
        }

        .cover-wrapper {
            width: 100%;
            height: 280px;
            background: var(--input-bg);
            position: relative;
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(11, 11, 14, 0.85);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-orange);
            backdrop-filter: blur(4px);
        }

        .card-details {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .manga-title {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .chapter-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            margin-top: 6px;
        }

        .chapter-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .chapter-num {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: var(--accent-orange);
            font-size: 1.1rem;
        }

        .btn-step {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 26px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .btn-step:hover {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: #fff;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ff4444;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: right;
            margin-top: 4px;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }
        .delete-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo"></div>
            <h1>AUREY's Manga <span>// Vault</span></h1>
        </div>

        <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 DARK</button>
    </header>

    <!-- Add New Manga Form -->
    <div class="add-card-form">
        <input type="text" id="inputTitle" placeholder="Manga Title (e.g., Berserk, Chainsaw Man)..." required>
        <input type="number" id="inputChapter" placeholder="Ch. #" style="max-width: 90px;" value="1">
        <input type="url" id="inputCover" placeholder="Optional Cover Image URL (leave blank to auto-fetch)...">
        <select id="inputStatus">
            <option value="Reading">Reading</option>
            <option value="Plan to Read">Plan to Read</option>
            <option value="Completed">Completed</option>
            <option value="Dropped">Dropped</option>
        </select>
        <button class="btn-action" id="addBtn" onclick="addManga()">+ Add Entry</button>
    </div>

    <!-- Live Grid -->
    <main class="manga-grid" id="mangaContainer">
        <div style="color: var(--text-muted);">Syncing with cloud database...</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Your exact Firebase project credentials
        const firebaseConfig = {
            apiKey: "AIzaSyBd8uDrxpy9jgoCu7GipIuja1Gwhk_n1Dg",
            authDomain: "aurey-hq.firebaseapp.com",
            databaseURL: "https://aurey-hq-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "aurey-hq",
            storageBucket: "aurey-hq.firebasestorage.app",
            messagingSenderId: "1044153557118",
            appId: "1:1044153557118:web:7f9164cd3291cf3e37382f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Zero-network memory fallback SVG
        const svgFallback = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='280' viewBox='0 0 220 280'><rect width='100%' height='100%' fill='%23181822'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%23ff6600' font-family='sans-serif' font-weight='bold' font-size='16'>NO COVER</text></svg>";

        // Real-time Database Listener
        const mangaRef = ref(db, 'manga');
        onValue(mangaRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('mangaContainer');
            
            if (!data) {
                container.innerHTML = `<div style="color: var(--text-muted); grid-column: 1/-1;">No manga entries yet. Add one above!</div>`;
                return;
            }

            container.innerHTML = Object.keys(data).map(key => {
                const item = data[key];
                const cover = item.cover || svgFallback;

                return `
                    <div class="manga-card">
                        <div class="cover-wrapper">
                            <img src="${cover}" class="cover-img" alt="" onerror="this.onerror=null; this.src='${svgFallback}';">
                            <span class="status-tag">${item.status}</span>
                        </div>
                        <div class="card-details">
                            <div class="manga-title" title="${item.title}">${item.title}</div>
                            
                            <div class="chapter-control">
                                <span class="chapter-label">CHAPTER</span>
                                <button class="btn-step" onclick="changeChapter('${key}', ${item.chapter - 1})">-</button>
                                <span class="chapter-num">${item.chapter}</span>
                                <button class="btn-step" onclick="changeChapter('${key}', ${item.chapter + 1})">+</button>
                            </div>

                            <button class="delete-btn" onclick="deleteEntry('${key}')">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');
        });

        // Add Manga Function using AniList GraphQL API (Fast & Stable)
        window.addManga = async function() {
            const titleInput = document.getElementById('inputTitle');
            const title = titleInput.value.trim();
            const chapter = parseInt(document.getElementById('inputChapter').value) || 1;
            let cover = document.getElementById('inputCover').value.trim();
            const status = document.getElementById('inputStatus').value;
            const addBtn = document.getElementById('addBtn');

            if (!title) return alert('Please enter a title!');

            // If user left cover URL blank, query AniList GraphQL API
            if (!cover) {
                addBtn.textContent = 'Searching AniList...';
                addBtn.disabled = true;

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                try {
                    const graphqlQuery = `
                        query ($search: String) {
                            Media (search: $search, type: MANGA) {
                                coverImage {
                                    large
                                }
                            }
                        }
                    `;

                    const response = await fetch('https://graphql.anilist.co', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({
                            query: graphqlQuery,
                            variables: { search: title }
                        }),
                        signal: controller.signal
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        cover = result?.data?.Media?.coverImage?.large || '';
                    }
                } catch (err) {
                    console.log('AniList cover fetch skipped or timed out.');
                    cover = ''; 
                } finally {
                    clearTimeout(timeoutId);
                    addBtn.textContent = '+ Add Entry';
                    addBtn.disabled = false;
                }
            }

            // Sanitize title into a safe database key (e.g., "Chainsaw Man" -> "chainsaw-man")
            const key = title.toLowerCase().replace(/[^a-z0-9]/g, '-');

            set(ref(db, `manga/${key}`), {
                title: title,
                chapter: chapter,
                cover: cover || '',
                status: status
            });

            // Clear inputs
            titleInput.value = '';
            document.getElementById('inputCover').value = '';
        };

        // Increment / Decrement Chapter
        window.changeChapter = function(key, newChapter) {
            if (newChapter < 0) return;
            update(ref(db, `manga/${key}`), { chapter: newChapter });
        };

        // Delete Entry
        window.deleteEntry = function(key) {
            if (confirm('Delete this entry?')) {
                remove(ref(db, `manga/${key}`));
            }
        };

        // Theme Toggle Logic
        window.toggleTheme = function() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('themePreference', newTheme);
            
            const btn = document.getElementById('themeToggleBtn');
            btn.textContent = newTheme === 'light' ? '☀️ LIGHT' : '🌙 DARK';
        };

        (function initTheme() {
            const savedTheme = localStorage.getItem('themePreference') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            const btn = document.getElementById('themeToggleBtn');
            if (btn) {
                btn.textContent = savedTheme === 'light' ? '☀️ LIGHT' : '🌙 DARK';
            }
        })();
    </script>
</body>
</html>
